<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Background -->
  <rect width="64" height="64" rx="16" fill="url(#gardenGrad)"/>
  
  <defs>
    <linearGradient id="gardenGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="furGrad" x1="16" y1="16" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="chestGrad" x1="28" y1="30" x2="40" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="8" y1="44" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Big Bushy Squirrel Tail -->
  <path d="M42 48 C54 44 58 28 50 18 C44 10 34 12 36 20 C38 26 44 28 42 38 C41 42 38 46 36 48 Z" fill="url(#furGrad)" stroke="#7c2d12" stroke-width="1.2"/>

  <!-- Squirrel Body -->
  <ellipse cx="32" cy="40" rx="12" ry="14" fill="url(#furGrad)" stroke="#7c2d12" stroke-width="1.2"/>
  <!-- Cream Chest -->
  <path d="M28 34 C28 34 32 32 36 34 C38 38 38 46 36 50 C32 52 28 50 28 46 Z" fill="url(#chestGrad)"/>

  <!-- Squirrel Head -->
  <circle cx="28" cy="24" r="10" fill="url(#furGrad)" stroke="#7c2d12" stroke-width="1.2"/>
  <!-- Cheek Puff -->
  <ellipse cx="23" cy="27" rx="4.5" ry="3.5" fill="#fed7aa"/>

  <!-- Left Ear -->
  <path d="M21 16 C20 10 25 12 25 16 Z" fill="url(#furGrad)" stroke="#7c2d12" stroke-width="1"/>
  <path d="M22 15 C21 12 24 13 24 15 Z" fill="#fbcfe8"/>

  <!-- Right Ear -->
  <path d="M29 15 C29 9 34 11 33 16 Z" fill="url(#furGrad)" stroke="#7c2d12" stroke-width="1"/>

  <!-- Eye -->
  <circle cx="26" cy="22" r="2.2" fill="#0f172a"/>
  <circle cx="25.3" cy="21.3" r="0.8" fill="#ffffff"/>

  <!-- Cute Nose -->
  <circle cx="19" cy="25" r="1.3" fill="#431407"/>

  <!-- Tiny Acorn in Paws -->
  <ellipse cx="24" cy="38" rx="3.5" ry="4.5" fill="#a16207" stroke="#451a03" stroke-width="0.8"/>
  <path d="M20.5 35.5 Q24 33 27.5 35.5 Z" fill="#713f12"/>
  <line x1="24" y1="33" x2="24" y2="31" stroke="#451a03" stroke-width="1" stroke-linecap="round"/>

  <!-- Foreground Leaf Sprig -->
  <path d="M6 56 Q14 42 26 48 Q16 58 6 56 Z" fill="url(#leafGrad)" stroke="#14532d" stroke-width="1"/>
  <path d="M2 62 Q16 52 30 58 Q14 66 2 62 Z" fill="#22c55e" opacity="0.85"/>
</svg>
